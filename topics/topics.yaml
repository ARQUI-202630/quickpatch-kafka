# Topics de QUICKPATCH: uno por tipo de evento, con el mismo nombre que eventType (ADR-006).
# Se crean de forma explícita en producción y en QA (hallazgo de POC-BE-001): los servicios no
# dependen de la creación automática. Cada topic debe tener su esquema en events/.
# Kafka es de un solo nodo (R10), por eso replicationFactor = 1.
topics:
  - name: service-request.created
    schema: events/service-request.created.v1.json
    producer: service-request-service
    consumers: [matching-service, communication-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  - name: catalog.category-changed
    schema: events/catalog.category-changed.v1.json
    producer: catalog-service
    consumers: [service-request-service, matching-service]
    partitions: 1
    replicationFactor: 1
    retentionHours: 168

  # Incremento del técnico (Sprint 4, DD V4). Los eventos del técnico usan technicianId como clave y
  # una partición: son pocos y llevan el estado completo con updatedAt (ADR-017). Los de matching usan
  # serviceRequestId como clave, con las mismas 3 particiones que service-request.created.
  - name: technician.registered
    schema: events/technician.registered.v1.json
    producer: identity-service
    consumers: [matching-service, communication-service]
    partitions: 1
    replicationFactor: 1
    retentionHours: 168

  - name: technician.verification-changed
    schema: events/technician.verification-changed.v1.json
    producer: identity-service
    consumers: [matching-service, communication-service]
    partitions: 1
    replicationFactor: 1
    retentionHours: 168

  - name: matching.offer-created
    schema: events/matching.offer-created.v1.json
    producer: matching-service
    consumers: [communication-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  # Communication ya no los consume: el aviso y el buzón de estado salen de service-request.status-changed
  # (SCRUM-466, SCRUM-456).
  - name: matching.technician-assigned
    schema: events/matching.technician-assigned.v1.json
    producer: matching-service
    consumers: [service-request-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  - name: matching.no-technician-available
    schema: events/matching.no-technician-available.v1.json
    producer: matching-service
    consumers: [service-request-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  - name: matching.search-resumed
    schema: events/matching.search-resumed.v1.json
    producer: matching-service
    consumers: [service-request-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  # Cambio de estado publicado por el dueño del estado (SCRUM-466): Communication avisa con él y no con
  # los eventos de Matching, que ServiceRequest puede descartar por viejos. Misma clave y particiones
  # que los demás eventos de la solicitud.
  - name: service-request.status-changed
    schema: events/service-request.status-changed.v1.json
    producer: service-request-service
    consumers: [communication-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  # Cancelación antes de iniciar el servicio (RF-36, SCRUM-472): Matching retira la oferta y libera al técnico.
  # El aviso en tiempo real sale de service-request.status-changed, que se publica en la misma transacción.
  - name: service-request.cancelled
    schema: events/service-request.cancelled.v1.json
    producer: service-request-service
    consumers: [matching-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  # Cotización (RF-34, RF-35, SCRUM-486): Communication avisa al cliente de la cotización y al técnico de la
  # respuesta. Van con status-changed en la misma transacción; el aviso sale de estos porque llevan el total y
  # las cotizaciones que quedan, que status-changed no tiene.
  - name: service-request.quoted
    schema: events/service-request.quoted.v1.json
    producer: service-request-service
    consumers: [communication-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  - name: service-request.quote-accepted
    schema: events/service-request.quote-accepted.v1.json
    producer: service-request-service
    consumers: [communication-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  - name: service-request.quote-rejected
    schema: events/service-request.quote-rejected.v1.json
    producer: service-request-service
    consumers: [communication-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  # Ejecución del servicio (RF-14, RF-15, SCRUM-35). Van con status-changed en la misma transacción.
  # started: el DD prevé que lo consuma Communication, pero el aviso al cliente ya sale de status-changed;
  # queda sin consumidores hasta que Communication lo necesite.
  - name: service-request.started
    schema: events/service-request.started.v1.json
    producer: service-request-service
    consumers: []
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  # completed: Matching libera al técnico (RN-M6) y Payments crea el pago pendiente (RN-P4, SCRUM-42).
  - name: service-request.completed
    schema: events/service-request.completed.v1.json
    producer: service-request-service
    consumers: [matching-service, payments-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  # Pago (SCRUM-42, pasarela simulada del ADR-009). Clave serviceRequestId, como los eventos de la solicitud.
  # ServiceRequest pasa a pagado con approved (RN-SR4); rejected no cambia el estado (RN-SR5).
  - name: payment.approved
    schema: events/payment.approved.v1.json
    producer: payments-service
    consumers: [service-request-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  - name: payment.rejected
    schema: events/payment.rejected.v1.json
    producer: payments-service
    consumers: [service-request-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  # Calificación y reputación (ADR-027, SCRUM-497). rated usa serviceRequestId como clave, como los demás eventos de la
  # solicitud; la reputación usa technicianId y una partición, como los eventos del técnico (ADR-017).
  - name: service-request.rated
    schema: events/service-request.rated.v1.json
    producer: service-request-service
    consumers: [ranking-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  - name: ranking.technician-reputation-changed
    schema: events/ranking.technician-reputation-changed.v1.json
    producer: ranking-service
    consumers: [identity-service]
    partitions: 1
    replicationFactor: 1
    retentionHours: 168

  # Activación o desactivación de un tenant (SCRUM-508, RN-T1). Clave data.tenantId; una partición porque
  # cambia muy pocas veces. ServiceRequest rechaza crear solicitudes de un tenant inactivo (422 tenant-inactivo).
  - name: tenant.status-changed
    schema: events/tenant.status-changed.v1.json
    producer: identity-service
    consumers: [service-request-service]
    partitions: 1
    replicationFactor: 1
    retentionHours: 168
