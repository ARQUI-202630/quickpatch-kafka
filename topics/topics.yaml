# Topics de QUICKPATCH: uno por tipo de evento, con el mismo nombre que eventType (ADR-006).
# Se crean de forma explícita en producción y en QA (hallazgo de POC-BE-001): los servicios no
# dependen de la creación automática. Cada topic debe tener su esquema en events/.
# Kafka es de un solo nodo (R10), por eso replicationFactor = 1.
topics:
  - name: service-request.created
    schema: events/service-request.created.v1.json
    producer: service-request-service
    consumers: [matching-service, communication-service]
    partitions: 3
    replicationFactor: 1
    retentionHours: 168

  - name: catalog.category-changed
    schema: events/catalog.category-changed.v1.json
    producer: catalog-service
    consumers: [service-request-service, matching-service]
    partitions: 1
    replicationFactor: 1
    retentionHours: 168
