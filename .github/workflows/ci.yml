# CI de quickpatch-kafka: autocontenido, sin workflows de otros repositorios (SCRUM-337).
#   CTR-004 y CTR-005 → AJV compila cada esquema de events/
#   topics            → topics/topics.yaml y events/ están alineados
#   compatibilidad    → en PR, rechaza cambios incompatibles frente a la rama base
#   CTR-006           → los tags deben tener la forma vMAJOR.MINOR.PATCH
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  eventos:
    name: Esquemas, topics y versión
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag con versión semántica (CTR-006)
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::El tag '$TAG' no sigue vMAJOR.MINOR.PATCH (CTR-006)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: AJV sobre events/ (CTR-004 y CTR-005)
        run: npx -y -p ajv-cli@5 -p ajv-formats@3 ajv compile --spec=draft7 -c ajv-formats --strict=false -s "events/*.json"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Topics alineados con los esquemas
        run: |
          pip install -q pyyaml==6.0.2
          python scripts/check-topics.py

      - name: Compatibilidad con la rama base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE"
          python scripts/check-compat.py "origin/$BASE"

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  quality-gate:
    name: quality-gate
    if: always()
    needs: [eventos, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Validar compuertas
        env:
          EVENT_RESULT: ${{ needs.eventos.result }}
          DEP_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$EVENT_RESULT" = "success"
          test "$DEP_RESULT" = "success" || test "$DEP_RESULT" = "skipped"
